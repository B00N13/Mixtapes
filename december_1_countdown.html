<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Countdown to December 1</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #121a33;
      --text: #eef3ff;
      --muted: #aeb9d6;
      --accent: #ff7a18;
      --border: rgba(255,255,255,.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,122,24,.10), transparent 35%),
        var(--bg);
      color: var(--text);
    }

    .wrap {
      width: min(760px, 100%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
    }

    .label {
      color: var(--muted);
      font-size: .9rem;
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 8px;
    }

    .value {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 800;
      line-height: .95;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .unit {
      margin-top: 10px;
      color: var(--text);
      font-size: 1.1rem;
    }

    .detail {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      line-height: 1.6;
    }

    .target {
      margin-top: 20px;
      color: var(--muted);
      font-size: .95rem;
      text-align: center;
    }

    @media (max-width: 560px) {
      .countdown {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Countdown to December 1</h1>
    <p class="subtitle">Automatically updates from the current date.</p>

    <section class="countdown" aria-live="polite">
      <article class="card">
        <div class="label">Days left</div>
        <div class="value" id="days">—</div>
        <div class="unit">days</div>
      </article>

      <article class="card">
        <div class="label">Weeks left</div>
        <div class="value" id="weeks">—</div>
        <div class="unit">weeks</div>
        <div class="detail" id="weekDetail"></div>
      </article>
    </section>

    <div class="target" id="targetText"></div>
  </main>

  <script>
    function getCountdown() {
      const now = new Date();

      // Work with calendar dates rather than hours so daylight-saving
      // changes do not affect the day count.
      const todayUTC = Date.UTC(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

      let targetYear = now.getFullYear();
      let targetUTC = Date.UTC(targetYear, 11, 1); // December = month 11

      // Once December 1 has passed, count down to December 1 next year.
      if (todayUTC > targetUTC) {
        targetYear += 1;
        targetUTC = Date.UTC(targetYear, 11, 1);
      }

      const msPerDay = 24 * 60 * 60 * 1000;
      const daysLeft = Math.round((targetUTC - todayUTC) / msPerDay);

      const fullWeeks = Math.floor(daysLeft / 7);
      const extraDays = daysLeft % 7;
      const decimalWeeks = daysLeft / 7;

      document.getElementById("days").textContent = daysLeft;
      document.getElementById("weeks").textContent = decimalWeeks.toFixed(1);

      document.getElementById("weekDetail").textContent =
        `${fullWeeks} full week${fullWeeks === 1 ? "" : "s"}`
        + (extraDays ? ` + ${extraDays} day${extraDays === 1 ? "" : "s"}` : "");

      document.getElementById("targetText").textContent =
        `Target date: 1 December ${targetYear}`;
    }

    getCountdown();

    // Refresh periodically in case the page stays open across midnight.
    setInterval(getCountdown, 60 * 1000);
  </script>
</body>
</html>
